<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cousins' Trip 2027 — From Ahmedabad (Jan 16–23)</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #263349;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --purple: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 2rem 1.25rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 680px;
      margin: 0 auto;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    /* Filter Pills */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.75rem;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    /* Grid View */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    .card-img-wrap {
      position: relative;
      height: 175px;
      width: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .card-img-wrap img {
      transform: scale(1.06);
    }

    .card-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.1) 55%, rgba(15, 23, 42, 0.35) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.75rem 0.9rem;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .card-num {
      font-size: 0.72rem;
      font-weight: 700;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(4px);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    .badge-intl { background: rgba(139, 92, 246, 0.85); color: #fff; }
    .badge-dom { background: rgba(16, 185, 129, 0.85); color: #052e16; }

    .card-body {
      padding: 1.1rem 1.2rem 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .card h2 {
      font-size: 1.22rem;
      margin-bottom: 0.2rem;
    }

    .card-sub {
      color: var(--muted);
      font-size: 0.84rem;
      margin-bottom: 0.9rem;
    }

    .meta-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.55rem;
      border-top: 1px solid var(--border);
      padding-top: 0.8rem;
      font-size: 0.82rem;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .meta-item span {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .meta-item strong {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }

    .card-cta {
      margin-top: 0.95rem;
      text-align: right;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Detail View */
    #detail-view {
      display: none;
    }

    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      margin: -1.5rem -1.25rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #7dd3fc;
      border-color: #7dd3fc;
    }

    .counter {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      padding: 0 0.4rem;
    }

    .hero-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .detail-banner {
      position: relative;
      height: 260px;
      width: 100%;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
    }

    .detail-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .detail-banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.35) 55%, rgba(15, 23, 42, 0.25) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
    }

    .detail-banner-overlay h2 {
      font-size: clamp(1.6rem, 3.5vw, 2.3rem);
      margin-bottom: 0.2rem;
    }

    .hero-tagline {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .hero-content {
      padding: 1.35rem 1.5rem 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.85rem;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
    }

    .stat-card small {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 0.2rem;
    }

    .stat-card strong {
      font-size: 0.95rem;
    }

    .note-box {
      margin-top: 1rem;
      background: rgba(251, 191, 36, 0.1);
      border-left: 3px solid var(--amber);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.88rem;
      color: #fde68a;
    }

    .itinerary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* Accordion / Dropdowns */
    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 0.85rem;
      overflow: hidden;
    }

    .day-trigger {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 1.1rem 1.25rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      transition: background 0.15s ease;
    }

    .day-trigger:hover {
      background: var(--surface-hover);
    }

    .day-left {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .day-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .day-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .day-travel {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .chevron {
      font-size: 1.1rem;
      color: var(--muted);
      transition: transform 0.22s ease;
      flex-shrink: 0;
    }

    .day-card.open .chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .day-body {
      display: none;
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.45);
      padding: 1.1rem 1.25rem 1.25rem;
    }

    .day-card.open .day-body {
      display: block;
    }

    .timeline {
      list-style: none;
      border-left: 2px solid var(--border);
      margin-left: 0.4rem;
      padding-left: 1.15rem;
    }

    .timeline li {
      position: relative;
      margin-bottom: 0.9rem;
    }

    .timeline li:last-child {
      margin-bottom: 0;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: -1.52rem;
      top: 0.42rem;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }

    .time-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--amber);
      margin-right: 0.4rem;
    }

    .step-text {
      font-size: 0.92rem;
      color: #e2e8f0;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .sticky-nav { justify-content: center; }
      .detail-banner { height: 210px; }
    }
  </style>
</head>

      destinations.forEach((d, idx) => {
        if (currentFilter === "international" && d.type !== "international") return;
        if (currentFilter === "domestic" && d.type !== "domestic") return;

        if (currentFilter === "warm" && d.climate !== "warm") return;

        card.className = "card";

        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${d.image}" alt="${d.name}" loading="lazy" onerror="this.style.display='none'" />

            <div>

                <div class="meta-item"><span>Jan Temp</span><strong>${d.temp}</strong></div>
                <div class="meta-item"><span>From AMD</span><strong>${d.flight}</strong></div>
                <div class="meta-item"><span>Visa / Entry</span><strong>${d.visa}</strong></div>
              </div>
              <div class="card-cta">View Day-Wise Plan →</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openDestination(index) {
      currentIndex = index;
      const d = destinations[currentIndex];
      const prevIdx = (currentIndex - 1 + destinations.length) % destinations.length;
      const nextIdx = (currentIndex + 1) % destinations.length;

      homeView.style.display = "none";
      detailView.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });

      document.getElementById("dest-counter").textContent = `${currentIndex + 1} / ${destinations.length}`;
      document.getElementById("top-prev-btn").textContent = `← ${destinations[prevIdx].name.split(" (")[0]}`;
      document.getElementById("top-next-btn").textContent = `${destinations[nextIdx].name.split(" (")[0]} →`;
      document.getElementById("bot-prev-btn").textContent = `← Prev: ${destinations[prevIdx].name.split(" (")[0]}`;
      document.getElementById("bot-next-btn").textContent = `Next: ${destinations[nextIdx].name.split(" (")[0]} →`;

      document.getElementById("detail-hero").innerHTML = `
        <div class="detail-banner">
          <img src="${d.image}" alt="${d.name}" onerror="this.style.display='none'" />
          <div class="detail-banner-overlay">
            <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.45rem;">
              <span class="card-num">Destination #${currentIndex + 1} of ${destinations.length}</span>
              <span class="badge ${d.type === 'international' ? 'badge-intl' : 'badge-dom'}">${d.type}</span>
            </div>
            <h2>${d.name}</h2>
            <p class="hero-tagline">${d.subtitle} — ${d.bestFor}</p>
          </div>
        </div>
        <div class="hero-content">
          <div class="stats-grid">
            <div class="stat-card"><small>January Temperature</small><strong>${d.temp}</strong></div>
            <div class="stat-card"><small>Flight from Ahmedabad</small><strong>${d.flight}</strong></div>
            <div class="stat-card"><small>Visa / Entry</small><strong>${d.visa}</strong></div>
          </div>
          ${d.note ? `<div class="note-box"><strong>Tip:</strong> ${d.note}</div>` : ""}
        </div>
      `;

      const daysContainer = document.getElementById("days-container");
      daysContainer.innerHTML = "";
      d.days.forEach((dayObj, i) => {
        const dayEl = document.createElement("div");
        dayEl.className = "day-card" + (i === 0 ? " open" : "");
        dayEl.innerHTML = `
          <button class="day-trigger" onclick="this.parentElement.classList.toggle('open')">
            <div class="day-left">
              <span class="day-label">${dayObj.day}</span>
              <span class="day-title">${dayObj.title}</span>
              <span class="day-travel">Travel: ${dayObj.travel}</span>
            </div>
            <span class="chevron">▼</span>
          </button>
          <div class="day-body">
            <ul class="timeline">
              ${dayObj.steps.map(s => `
                <li>
                  <span class="time-tag">${s.time}</span>
                  <span class="step-text">${s.text}</span>
                </li>
              `).join("")}
            </ul>
          </div>
        `;
        daysContainer.appendChild(dayEl);
      });

      document.getElementById("toggle-all-btn").textContent = "Expand All Days";
    }

    function navigate(step) {
      const nextIndex = (currentIndex + step + destinations.length) % destinations.length;
      openDestination(nextIndex);
    }

    function showHome() {
      detailView.style.display = "none";
      homeView.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleAllDays() {
      const cards = document.querySelectorAll(".day-card");
      const btn = document.getElementById("toggle-all-btn");
      const allOpen = Array.from(cards).every(c => c.classList.contains("open"));
      cards.forEach(c => c.classList.toggle("open", !allOpen));
      btn.textContent = allOpen ? "Expand All Days" : "Collapse All Days";
    }

    document.getElementById("filter-bar").addEventListener("click", (e) => {
      if (!e.target.classList.contains("filter-btn")) return;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      currentFilter = e.target.dataset.filter;
      renderGrid();
    });

    renderGrid();
  </script>
</body>
</html>
